# todo: 修改生产环境配置

Name: api
Host: 0.0.0.0
Port: 8888

Timeout: 30000
MaxBytes: 10485760

Auth:
  AccessSecret: "${JWT_SECRET}"
  AccessExpire: 604800

DataSource: "${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"

MySQL:
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 300

Redis:
  - Host: "${REDIS_HOST}:${REDIS_PORT}"
    Pass: "${REDIS_PASSWORD}"

Log:
  ServiceName: api
  Mode: file
  Level: error
  Encoding: json
  Path: logs
  Compress: true
  KeepDays: 30
  StackCoolDownMillis: 100
