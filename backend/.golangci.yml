run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gocritic
    - gofmt
    - goimports

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
  goimports:
    local-prefixes: cizhima-backend

issues:
  exclude-rules:
    - path: _gen\.go
      linters:
        - errcheck
        - gocritic
    - path: internal/handler/
      linters:
        - errcheck
    - path: internal/types/
      linters:
        - gocritic
    - path: pkg/model/
      linters:
        - errcheck
        - gocritic
